<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logos Prebisch</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF5EC;--surface:#FFFDF8;--line:#E8DCC9;--ink:#3A2A22;--muted:#6A4940;--accent:#8A4F2A}
@media (prefers-color-scheme:dark){:root{--bg:#1C1612;--surface:#241D18;--line:#352A22;--ink:#EFE6DA;--muted:#C2AE9D;--accent:#D9A06A}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Serif 4",Georgia,serif}
main{max-width:1040px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:28px;font-weight:600;margin:0 0 4px}p.lead{color:var(--muted);margin:0 0 24px;max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{font-size:19px;font-weight:600;margin:0 0 2px}.n{font:500 12px "IBM Plex Mono",monospace;color:var(--muted)}
.hero{display:flex;justify-content:center;padding:12px 0}
.row{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px 0 8px}
svg{display:block}.cap{font:11px "IBM Plex Mono",monospace;color:var(--muted);text-align:center;margin-top:4px}
.card p{margin:6px 0 0;font-size:14px}
</style></head><body><main>
<h1>Prebisch: el sello 01 con el gráfico al frente</h1>
<p class="lead">Diez variantes del sello clásico. Mantienen el doble anillo y el texto, y el diagrama de oferta y demanda crece, se marca o rompe el sello. Cada una en crema, invertida, en modo oscuro y a 48 px.</p>
<div class="grid" id="g"></div>
</main>
<script>
const GAR="Cormorant Garamond,Source Serif 4,Georgia,serif";
let uid=0;
const ring=(r,w,c,extra="")=>`<circle cx="60" cy="60" r="${r}" fill="none" stroke="${c}" stroke-width="${w}" ${extra}/>`;
// texto en arco: arriba (glifos hacia afuera) o abajo (glifos hacia adentro)
function arc(txt,r,c,{pos="top",size=7.4,ls=2.2,w=600}={}){
  const id="a"+(uid++);
  const d=pos==="top"?`M${60-r} 60A${r} ${r} 0 0 1 ${60+r} 60`:`M${60-r} 60A${r} ${r} 0 0 0 ${60+r} 60`;
  return `<path id="${id}" d="${d}" fill="none"/><text font-family="${GAR}" font-weight="${w}" font-size="${size}" letter-spacing="${ls}" fill="${c}"><textPath href="#${id}" startOffset="50%" text-anchor="middle">${txt}</textPath></text>`;
}
// curvas: D cae, S sube; se cruzan en (60,60)
const D="M40 40Q50 64 82 76", S="M38 78Q62 70 80 38";
const q=(p0,p1,p2,t)=>[(1-t)**2*p0[0]+2*(1-t)*t*p1[0]+t*t*p2[0],(1-t)**2*p0[1]+2*(1-t)*t*p1[1]+t*t*p2[1]];
const E=(()=>{let b=[0,0,1e9];for(let i=0;i<=400;i++)for(let j=0;j<=400;j++){const a=q([40,40],[50,64],[82,76],i/400),c=q([38,78],[62,70],[80,38],j/400);const d=Math.hypot(a[0]-c[0],a[1]-c[1]);if(d<b[2])b=[a[0],a[1],d]}return[+b[0].toFixed(2),+b[1].toFixed(2)]})();
const curves=(c,w=1.3)=>`<path d="${D}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/><path d="${S}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const axes=(c,{o=[34,86],t=[34,32],x=[90,86],w=.8}={})=>`<path d="M${t[0]} ${t[1]}V${o[1]}H${x[0]}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const guides=(c,o=[34,86])=>`<path d="M${o[0]} ${E[1]}H${E[0]}V${o[1]}" fill="none" stroke="${c}" stroke-width=".6" stroke-dasharray="1.6 1.8"/>`;
const dot=(c,r=2.2)=>`<circle cx="${E[0]}" cy="${E[1]}" r="${r}" fill="${c}"/>`;
const ticks=(r1,r2,n,c,w=.5)=>Array.from({length:n},(_,i)=>{const a=i/n*2*Math.PI;return `<line x1="${60+r1*Math.cos(a)}" y1="${60+r1*Math.sin(a)}" x2="${60+r2*Math.cos(a)}" y2="${60+r2*Math.sin(a)}" stroke="${c}" stroke-width="${w}"/>`}).join("");
const it=(t,x,y,s,c,anchor="middle")=>`<text x="${x}" y="${y}" text-anchor="${anchor}" font-family="${GAR}" font-style="italic" font-weight="500" font-size="${s}" fill="${c}">${t}</text>`;
const star=(x,y,c,s=1.6)=>`<path d="M${x} ${y-s}L${x+s*.35} ${y}L${x} ${y+s}L${x-s*.35} ${y}Z" fill="${c}"/>`;
const leaves=(c,side)=>{const R=47,a0=side>0?12:168,a1=side>0?78:102,rad=x=>x*Math.PI/180;const P=a=>[60+R*Math.cos(rad(a)),60+R*Math.sin(rad(a))];const[x0,y0]=P(a0),[x1,y1]=P(a1);let o=`<path d="M${x0} ${y0}A${R} ${R} 0 0 ${side>0?1:0} ${x1} ${y1}" fill="none" stroke="${c}" stroke-width=".6"/>`;for(let i=0;i<6;i++){const a=a0+(a1-a0)*(i+.5)/6;const[x,y]=P(a);const tan=a+(side>0?90:-90);for(const k of[-1,1]){const rot=tan+k*38*side;const dx=3.2*Math.cos(rad(rot)),dy=3.2*Math.sin(rad(rot));o+=`<ellipse cx="${x+dx}" cy="${y+dy}" rx="3.4" ry="1.15" transform="rotate(${rot} ${x+dx} ${y+dy})" fill="${c}" opacity=".9"/>`}}return o};
const scallop=(c,w)=>{let d="";const n=32;for(let i=0;i<=n*2;i++){const a=i/(n*2)*2*Math.PI;const r=i%2?55:57.5;d+=(i?"L":"M")+(60+r*Math.cos(a)).toFixed(2)+" "+(60+r*Math.sin(a)).toFixed(2)}return `<path d="${d}Z" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round"/>`};

// Base del 01: doble anillo, PREBISCH arriba, ECONOMÍA · DE A POCO abajo, rombos a los lados
const base=(c,{inner=true,band=true}={})=>ring(56,1.1,c)+ring(53.6,.5,c)+(inner?ring(38,.5,c):"")+(band?arc("PREBISCH",43.5,c)+arc("ECONOMÍA · DE A POCO",50.5,c,{pos:"bottom",size:6,ls:1.6})+star(18.5,60,c)+star(101.5,60,c):"");
const G=(k,inner,x=60,y=60)=>`<g transform="translate(${x} ${y}) scale(${k}) translate(-62 -59)">${inner}</g>`;
const clipC=(r,inner)=>{const id="k"+(uid++);return `<defs><clipPath id="${id}"><circle cx="60" cy="60" r="${r}"/></clipPath></defs><g clip-path="url(#${id})">${inner}</g>`};
// rectas para las variantes con excedentes
const DL="M34 34L86 82",SL="M34 84L86 36",EL=[60,58];
const L=[
{t:"Más grande, sin anillo interior",d:"Saqué el anillo de adentro y el diagrama ocupa todo el centro, casi hasta el texto. Es el cambio mínimo respecto del 01.",
 m:c=>base(c,{inner:false})+G(.86,axes(c,{w:1.1})+guides(c)+curves(c,1.9)+dot(c,2.8))},
{t:"Ejes que cortan el anillo",d:"Los ejes atraviesan el anillo interior y llegan hasta el texto, así el gráfico se apoya en el sello en vez de flotar adentro.",
 m:c=>base(c)+`<path d="M38 27V82H93" fill="none" stroke="${c}" stroke-width="1" stroke-linecap="round"/>`+G(.82,guides(c)+curves(c,2.1)+dot(c,3),64,56)},
{t:"Excedentes sombreados",d:"El área del consumidor en tono claro y la del productor en tono medio. Es el diagrama completo que se ve en la cursada, y el color le da peso.",
 m:c=>base(c,{inner:false})+G(.84,`<path d="M34 34L60 58H34Z" fill="${c}" opacity=".14"/><path d="M34 58H60L34 84Z" fill="${c}" opacity=".32"/>`+`<path d="M34 30V86H90" fill="none" stroke="${c}" stroke-width="1.1"/>`+`<path d="${DL}" stroke="${c}" stroke-width="1.9" stroke-linecap="round"/><path d="${SL}" stroke="${c}" stroke-width="1.9" stroke-linecap="round"/><circle cx="60" cy="58" r="2.8" fill="${c}"/>`)},
{t:"Curvas de borde a borde",d:"Sin ejes: la oferta y la demanda cruzan todo el círculo interior. El cruce queda justo en el centro del sello.",
 m:c=>base(c)+clipC(38,`<path d="M20 26Q46 54 102 80" fill="none" stroke="${c}" stroke-width="1.8"/><path d="M18 94Q56 66 98 18" fill="none" stroke="${c}" stroke-width="1.8"/>`)+`<circle cx="57.3" cy="62.6" r="2.8" fill="${c}"/>`},
{t:"Medallón en negativo",d:"El centro se rellena con el color de tinta y el gráfico va calado en crema. Es la que más se impone a la distancia.",
 m:(c,b)=>base(c,{inner:false})+`<circle cx="60" cy="60" r="38.5" fill="${c}"/>`+G(.8,axes(b,{w:1.1})+guides(b)+curves(b,2)+dot(b,2.8))},
{t:"Banda fina, gráfico máximo",d:"El texto se achica y se pega al borde, y el diagrama crece casi un 50 % respecto del 01.",
 m:c=>ring(56,1.1,c)+ring(46.5,.5,c)+arc("PREBISCH",48,c,{size:6,ls:2.6})+arc("ECONOMÍA · DE A POCO",53,c,{pos:"bottom",size:4.8,ls:1.4})+star(8.6,60,c,1.3)+star(111.4,60,c,1.3)+G(.98,axes(c,{w:1})+guides(c)+curves(c,1.8)+dot(c,2.6))},
{t:"Con rótulos",d:"Las curvas llevan su nombre en itálica, O y D, y los ejes P y Q. Se lee como un gráfico de verdad, no como un adorno.",
 m:c=>base(c,{inner:false})+G(.84,axes(c,{w:1.1})+curves(c,1.9)+dot(c,2.8)+it("D",86,80,9,c,"start")+it("O",82,38,9,c,"start")+it("P",34,28,9,c)+it("Q",94,89,9,c,"start"))},
{t:"Equilibrio protagonista",d:"El punto de equilibrio crece y lleva un aro, con guías punteadas a P* y Q*. La mirada va directo al cruce.",
 m:c=>base(c,{inner:false})+G(.86,axes(c,{w:1.1})+guides(c)+curves(c,2)+`<circle cx="${E[0]}" cy="${E[1]}" r="6" fill="none" stroke="${c}" stroke-width=".9"/>`+dot(c,3.2)+it("P*",31,E[1]+2.8,8.5,c,"end")+it("Q*",E[0],96,8.5,c))},
{t:"Gráfico que rompe el sello",d:"La oferta sale del sello por arriba a la derecha y corta los anillos y el texto. Es la más dinámica, sin perder lo académico.",
 m:(c,b)=>base(c,{inner:false})+`<path d="M38 80Q70 70 104 18" fill="none" stroke="${b}" stroke-width="6" stroke-linecap="round"/><path d="M38 80Q70 70 104 18" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"/><path d="M34 34V86H88" fill="none" stroke="${c}" stroke-width="1"/><path d="M40 38Q50 66 84 78" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"/><circle cx="58.6" cy="66.5" r="2.8" fill="${c}"/>`},
{t:"Desplazamiento de la demanda",d:"Hay dos demandas: D y D′ punteada. El equilibrio se mueve de un punto al otro. Cuenta lo que hace el análisis económico: comparar escenarios.",
 m:c=>base(c,{inner:false})+G(.86,axes(c,{w:1.1})+curves(c,1.9)+`<path d="M50 36Q60 60 90 70" fill="none" stroke="${c}" stroke-width="1.4" stroke-dasharray="3 2.2" stroke-linecap="round"/>`+dot(c,2.6)+`<circle cx="69.5" cy="57.5" r="2.6" fill="none" stroke="${c}" stroke-width="1.2"/>`+`<path d="M64.5 61.5L67.5 59.3" stroke="${c}" stroke-width=".8" stroke-linecap="round"/>`)}
];
const tile=(m,bg,fg,s,rx=0)=>`<svg width="${s}" height="${s}" viewBox="0 0 120 120">${bg?`<rect width="120" height="120" rx="${rx}" fill="${bg}"/>`:""}${m(fg,bg)}</svg>`;
document.getElementById("g").innerHTML=L.map((o,i)=>`<div class="card"><div class="n">${String(i+1).padStart(2,"0")}</div><h2>${o.t}</h2>
<div class="hero">${tile(o.m,"#FAF5EC","#5A3420",200,16)}</div>
<div class="row">
<div>${tile(o.m,"#8A4F2A","#FAF5EC",72,14)}<div class="cap">invertido</div></div>
<div>${tile(o.m,"#1C1612","#D9A06A",72,14)}<div class="cap">oscuro</div></div>
<div>${tile(o.m,"#FAF5EC","#5A3420",48,10)}<div class="cap">48 px</div></div>
</div><p>${o.d}</p></div>`).join("");
</script></body></html>
