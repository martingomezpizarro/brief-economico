<html lang="es">
<head>
<meta charset="utf-8">

<meta name="referrer" content="strict-origin-when-cross-origin">

<meta property="og:description" content="Briefs diarios de economía: lecturas de 15 minutos sobre papers y libros, preguntas de control y repaso espaciado. Armá tu propia ruta de estudio con tus PDFs.">
<meta property="og:url" content="https://prebisch.martingomezpizarro.com.ar/">
<meta property="og:image" content="https://prebisch.martingomezpizarro.com.ar/iconos/icono-512.png">
<meta property="og:locale" content="es_AR">

<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png?v=3">
<link rel="manifest" href="manifest.webmanifest?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prebisch">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una columna de lectura (≈38rem) estilo paper anotado; en pantallas anchas la ficha abre una columna de notas al margen. */
:root{
  --bg:#FAF5EC; --surface:#FFFDF8; --honey:#F3E4CC; --line:#E8DCC9; --line2:#D6C6B0;
  --ink:#3A2A22; --ink2:#4E3A30; --muted:#6A4940; --accent:#8A4F2A; --accent-ink:#FFFFFF; --again:#A33A22;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1C1612; --surface:#241D18; --honey:#3A2C20; --line:#352A22; --line2:#4A3B30;
  --ink:#EFE6DA; --ink2:#DCCDBE; --muted:#C2AE9D; --accent:#D9A06A; --accent-ink:#1C1612; --again:#F08A6C; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1C1612; --surface:#241D18; --honey:#3A2C20; --line:#352A22; --line2:#4A3B30;
  --ink:#EFE6DA; --ink2:#DCCDBE; --muted:#C2AE9D; --accent:#D9A06A; --accent-ink:#1C1612; --again:#F08A6C; color-scheme:dark }

html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
a{color:var(--accent);text-underline-offset:2px;text-decoration-thickness:1px}
a:hover{color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:40rem;margin:0 auto;display:flex;flex-direction:column;gap:28px}
/* el encabezado usa todo el ancho; el contenido, una columna de lectura salvo en las vistas de listas */
#wrap{max-width:74rem}
#wrap #main{max-width:40rem;width:100%;margin:0 auto}
#wrap.ancha #main{max-width:52rem}
@media (min-width:900px){ #wrap #main.ancho{max-width:74rem} }
.cols,.col,.grid2,.hoy,.hoy-top,.hoy-par{display:flex;flex-direction:column;gap:28px;min-width:0}
@media (min-width:900px){
  .cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:56px;align-items:start}
  .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 56px;align-items:start}
  /* Hoy: brief y tarjetas en mitades iguales, con los botones en la misma fila */
  .hoy-par{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 56px;align-items:stretch}
  .hoy-par>.block>.btn,.hoy-par>.block>.muted:last-child{margin-top:auto}
  .hoy-par>.rule{border-top:0;padding-top:0}
}
.volver{font-family:var(--mono);font-size:12px;margin-bottom:-12px}
.volver-flot{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:50;display:flex;align-items:center;gap:2px;max-width:calc(100vw - 32px);background:var(--ink);color:var(--bg);border-radius:999px;box-shadow:0 4px 18px rgba(0,0,0,.25);font-family:var(--mono);font-size:12px;padding:2px 4px 2px 14px}
.volver-flot a{color:inherit;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:36px;display:inline-flex;align-items:center}
.volver-flot button{background:none;border:0;color:inherit;opacity:.7;font:inherit;min-width:36px;min-height:36px;cursor:pointer;border-radius:50%}
.volver-flot button:hover{opacity:1}
body:has(.volver-flot) #main{padding-bottom:64px}
.aviso-drive{position:relative;border:1px solid var(--accent);border-radius:8px;padding:14px 16px;margin:12px 0;display:flex;flex-direction:column;gap:8px}
.aviso-drive[hidden]{display:none}
.pegar-vinculos{margin-top:8px}
.pegar-vinculos textarea{width:100%;margin:6px 0;font-family:var(--mono);font-size:12px}
.aviso-drive ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.aviso-drive .cerrar{position:absolute;top:6px;right:6px}
.volver a{text-decoration:none;color:var(--muted);display:inline-flex;align-items:center;min-height:32px}
.volver a:hover{color:var(--accent)}
.cuenta-btn{font-family:var(--mono);font-size:12px;text-decoration:none;color:var(--ink);border:1px solid var(--line2);border-radius:2px;min-height:32px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.cuenta-btn .ini{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.cuenta-btn[aria-current="page"]{background:var(--honey)}
.der{display:flex;gap:8px;align-items:center}
@media (max-width:760px){ .der{order:2} .nav{order:3;width:100%} }
.src{border-top:1px dashed var(--line2);padding-top:12px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.src b{font-family:var(--mono);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.src .ref{color:var(--ink2)}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.c{text-align:center}
.j{text-align:justify;hyphens:auto;-webkit-hyphens:auto}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;text-align:left}

/* barra */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font:600 25px/1 "Cormorant Garamond",var(--serif);letter-spacing:.04em;text-decoration:none;color:var(--ink)}
.brand svg{color:var(--accent);flex:none}
.sello{display:flex;justify-content:center;color:var(--accent)}
.sello svg{max-width:100%;height:auto}
.orn{display:flex;align-items:center;gap:12px;color:var(--line2)}
.orn::before,.orn::after{content:"";flex:1;border-top:1px solid var(--line)}
.orn svg{color:var(--accent);opacity:.8}
.cuenta{display:flex;flex-direction:column;gap:10px}
.cuenta input{font:15px var(--serif);background:var(--surface);color:var(--ink);border:1px solid var(--line2);border-radius:2px;padding:10px;width:100%;box-sizing:border-box;min-height:44px}
.sep{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sep::before,.sep::after{content:"";flex:1;border-top:1px solid var(--line)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-size:14px}
.nav{display:flex;gap:4px;flex-wrap:wrap;font-family:var(--mono);font-size:12px}
.nav a{padding:8px 10px;text-decoration:none;color:var(--muted);border-radius:2px}
.nav a[aria-current="page"]{color:var(--ink);background:var(--honey)}
.lang{display:flex;gap:4px;font-family:var(--mono);font-size:12px}
.lang button{min-width:44px;min-height:32px;border:1px solid var(--line2);background:transparent;color:var(--muted);border-radius:2px}
.lang button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* bloques */
.block{display:flex;flex-direction:column;gap:12px}
.rule{border-top:1px solid var(--line);padding-top:20px}
.box{background:var(--honey);padding:14px 16px;border-radius:2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.stat b{display:block;font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.btn{min-height:48px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:2px;font-size:16px;padding:0 20px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.cajas{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;text-align:center;font-family:var(--mono);font-size:12px}
.caja{border:1px solid var(--line);padding:8px 2px;border-radius:2px;color:var(--muted)}
.caja b{display:block;font-size:16px;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}
.note{font-size:14px;color:var(--muted)}

/* sesión */
.card{display:flex;flex-direction:column;gap:16px;padding-top:4px}
.card h2{font-size:23px;line-height:1.3;text-align:center}
.cita{font-style:italic;color:var(--muted);text-align:center;font-size:15px}
.ans{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.ans p{font-size:17px}
.fuente{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-family:var(--mono);font-size:12px}
.grades button{min-height:48px;border:1px solid var(--line2);background:transparent;border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.grades button small{color:var(--muted);font-size:10px}
.grades .g1{color:var(--again)}
.top{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted);gap:8px}
.meter{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .25s}

/* ficha */
.ficha{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media (min-width:640px){ .ficha.margen{grid-template-columns:minmax(0,1fr) 10rem} }
.ficha section{display:flex;flex-direction:column;gap:8px}
.ficha h3{font-size:13px;font-family:var(--mono);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);text-align:center}
.aside{font-size:13px;line-height:1.45;color:var(--muted);display:flex;flex-direction:column;gap:14px;text-align:left}
.aside b{font-family:var(--mono);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);display:block;margin-bottom:2px}
.eq{background:var(--honey);padding:12px 14px;border-radius:2px;overflow-x:auto;display:flex;flex-direction:column;gap:8px;align-items:center}
.eq .raw{font-family:var(--mono);font-size:13px;white-space:pre-wrap;word-break:break-word}
.eq .donde{align-self:stretch;font-size:14px;line-height:1.45}
.eq .donde p{margin:2px 0}
.eq .donde ul{margin:0;padding-left:18px}
dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
dt{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
dd{margin:0}
.critica{color:var(--ink2)}

/* rack */
.area{display:flex;flex-direction:column;gap:10px;scroll-margin-top:16px}
.area h2{font-size:20px;text-align:center}
.area .cnt{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}
.plist{list-style:none;padding:0;gap:0}
.plist li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.plist li .t{min-width:0;overflow-wrap:anywhere}
.tag{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.tag.on{color:var(--accent)}
.leccion{display:flex;flex-direction:column;gap:14px}
.leccion h1{font-size:27px;line-height:1.22}
.leccion h2{font-size:19px;margin-top:10px}
.leccion section{display:flex;flex-direction:column;gap:10px}
.leccion .lead{font-size:18px}
.leccion .box h2{margin-top:0}
.ops{display:flex;flex-direction:column;gap:8px}
.op{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line2);background:var(--surface);border-radius:2px;padding:12px 14px;min-height:48px;font-size:16px;line-height:1.4}
.op .let{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:3px;flex:none}
.op:not(:disabled):hover{border-color:var(--accent)}
.op:disabled{cursor:default}
.op.ok{border-color:var(--accent);background:var(--honey)}
.op.mal{border-color:var(--again);color:var(--again)}
.bien{color:var(--accent);font-weight:600}
p.mal{color:var(--again);font-weight:600}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.campo{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.campo label,.campo .lbl{font-size:15px}
.campo textarea,.campo input[type=text],.campo input[type=password],.campo input[type=number],.campo select{font:15px var(--serif);background:var(--surface);color:var(--ink);border:1px solid var(--line2);border-radius:2px;padding:10px;width:100%;box-sizing:border-box}
.campo textarea{min-height:96px;resize:vertical}
.docs{list-style:none;padding:0;display:flex;flex-direction:column;gap:0}
.docs li{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:9px 0}
.docs li .t{flex:1;min-width:0;overflow-wrap:anywhere}
.docs .meta{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.campo select,#main select{max-width:100%}
main select{width:100%}
.row>*{min-width:0}
.row select{max-width:100%}
.eq{max-width:100%;box-sizing:border-box}
.leccion,.leccion section{min-width:0;max-width:100%}
.tex{max-width:100%;overflow-x:auto}
.eq .raw{overflow-wrap:anywhere}
#main,#main>*{min-width:0;max-width:100%}
select{min-width:0;max-width:100%}
.docs input[type=text]{width:6.5rem;font:13px var(--mono);padding:6px;border:1px solid var(--line2);border-radius:2px;background:var(--surface);color:var(--ink)}
.mini{font:12px var(--mono);border:1px solid var(--line2);background:transparent;border-radius:2px;padding:6px 8px;min-height:32px;color:var(--muted)}
.estado{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;white-space:pre-wrap}
.guia-indice{max-width:30rem;margin:8px auto 0;padding-left:1.4em}
.guia-pasos{padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.guia-pasos li::marker{font-family:var(--mono);color:var(--accent)}
.guia-img{display:block;max-width:100%;height:auto;margin:8px auto;border:1px solid var(--line);border-radius:6px}
.guia-codigo{font-family:var(--mono);font-size:11px;line-height:1.45;max-height:16rem;overflow:auto;white-space:pre;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--paper,transparent)}
.guia-script{display:flex;flex-direction:column;gap:8px}
.link-manual{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.link-manual input{flex:1 1 14rem;min-width:0}
.link-manual .estado{flex-basis:100%}
.dlg-ia{border:1px solid var(--line2);background:var(--surface);color:var(--ink);padding:20px 18px;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;border-radius:6px}
.dlg-ia::backdrop{background:rgba(30,20,15,.45)}
.dlg-ia .pasos-ia{padding-left:1.3em;margin:8px 0}
.dlg-ia .pasos-ia li{margin:0 0 16px;line-height:1.5}
.dlg-ia .pasos-ia li>.btn{display:inline-block;width:auto;margin:0 10px 0 0}
.dlg-ia textarea{display:block;width:100%;min-height:120px;margin:8px 0;font:13px/1.4 ui-monospace,Menlo,monospace;box-sizing:border-box}
.adm-brief{margin:10px 0 6px;padding:12px 14px;border-left:3px solid var(--line2);background:var(--surface)}
.adm-brief h3{font-size:16px;margin:14px 0 6px}
.chk{display:block;margin:6px 0;font-size:14px}
.seguridad{margin:12px 0;border:1px solid var(--line);padding:10px 12px;background:var(--surface)}
.seguridad summary{cursor:pointer;font-weight:600}
.seguridad li{margin:6px 0;line-height:1.5}
.nombre-pdf{font-family:var(--mono);font-size:12px;word-break:break-word;background:none;color:var(--ink)}
.estado.error{color:var(--again)}
.drop{border:1px dashed var(--line2);border-radius:2px;padding:18px;text-align:center;color:var(--muted);cursor:pointer}
.drop.sobre{border-color:var(--accent);background:var(--honey)}
.pasoplan{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:flex-start}
.pasoplan .t{flex:1}
.pasoplan input[type=text]{width:100%;font:600 15px var(--serif);border:1px solid var(--line2);border-radius:2px;padding:6px;background:var(--surface);color:var(--ink);box-sizing:border-box}
.plist .num{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:1.8rem;flex:none}
.plist .t{flex:1}
.plist .meta,.rutas .meta{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.plist a.sinficha{color:var(--ink2);text-decoration-color:var(--line2)}
.tag.leido{color:var(--accent)}
.rutas{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:10px}
.rutas li{border:1px solid var(--line);border-radius:2px;padding:12px;display:flex;flex-direction:column;gap:8px}
.rutas li.foco{border-color:var(--accent);background:var(--honey)}
.rutas li>a{font-weight:600;text-decoration:none;color:var(--ink)}
.rutas li>a:hover{color:var(--accent)}
.leer{display:flex;gap:8px;align-items:center;justify-content:center;font-size:15px}
.leer input{accent-color:var(--accent);width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);padding:3px 8px;border-radius:2px;color:var(--muted)}

/* índice lateral (Ajustes, Mi estudio, Rutas): en compu, columna fija a la izquierda con la sección actual marcada;
   en el celular, una barra arriba "Estás en: Ajustes › Avisos ▾" que despliega el índice. */
.idx-cuerpo{display:flex;flex-direction:column;gap:28px;min-width:0}
.idx-sec{scroll-margin-top:64px}
.idx{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin:-12px -16px 0;padding:0 16px}
.idx-btn{display:flex;align-items:center;gap:6px;width:100%;min-height:44px;background:none;border:0;padding:0;text-align:left;font-family:var(--mono);font-size:12px;color:var(--muted)}
.idx-btn b{color:var(--ink);font-weight:500}
.idx-btn .idx-act{color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto}
.idx-btn .idx-car{margin-left:auto;transition:transform .2s}
.idx.abierto .idx-btn .idx-car{transform:rotate(180deg)}
.idx-tit{display:none}
.idx ol{display:none;list-style:none;margin:0;padding:4px 0 12px;border-left:1px solid var(--line)}
.idx.abierto ol{display:block}

/* ---------- utilidades ---------- */
function h(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==="on")for(const ev in v)e.addEventListener(ev,v[ev]);else if(k==="class")e.className=v;else e.setAttribute(k,v===true?"":v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:String(c))}return e}
const today=()=>{const d=new Date();return Math.floor((d-d.getTimezoneOffset()*6e4)/864e5)};
const tr=k=>T[S.lang][k]||k;
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function areaName(code){return (S.areas&&S.areas.nombres[code])||code}
function cita(pid){const p=S.papers["p"+pid];return p?(p.cita||p.titulo):"#"+pid}
function defaultEst(){return{lecciones:{},cards:{},cfg:{hora:"08:00",minutos:10,nuevas:8,areas:(S.areas?S.areas.orden.slice():[]),vistas:(S.areas?S.areas.orden.slice():[]),lang:"es",foco:""},dia:{f:0,n:0},hist:{},leidos:{}}}
function nivName(n){return S.lang==="es"?(S.niveles[n]||n):(NIV_EN[n]||n)}
function ruta(id){return S.rutas.find(r=>r.id===id)||S.mis.rutas.find(r=>r.id===id)}
function rutaNombre(r){if(!r)return"";return r.tipo==="area"?areaName(r.id):r.nombre}
function rutaEtiqueta(r){if(!r)return"";return r.tipo==="mia"?(S.lang==="es"?"Mi estudio":"My study")+" › "+r.nombre:areaName(rutaArea(r))+" › "+rutaNombre(r)}
function rutaArea(r){return !r?"":(r.tipo==="area"?r.id:(r.area||""))}

function lecDone(l){return S.est.lecciones[l.id]}
function lecDeRuta(r){if(!r)return[];if(r.tipo==="mia")return r.pasos.map(p=>p.lec&&S.lecById[p.lec]).filter(Boolean);return S.lecciones.filter(l=>r.tipo==="cat"?l.cat===r.id:(ruta(l.cat)||{}).area===r.id)}
function nextLeccion(){
  const t=today();const hoy=S.lecciones.find(l=>{const d=lecDone(l);return d&&d.d===t});
  const foco=S.est.cfg.foco?ruta(S.est.cfg.foco):null;
  const pend=ls=>ls.find(l=>!lecDone(l));
  const pasoPend=foco&&foco.tipo==="mia"?foco.pasos.find(p=>!p.lec):null;
  return{hoy,sig:(foco&&pend(lecDeRuta(foco)))||(pasoPend?null:pend(S.lecciones.filter(l=>!l.mia)))||null,paso:pasoPend,foco};
}

/* ---------- carga ---------- */
const getJSON=p=>fetch(p,{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(p+" "+r.status);return r.json()});
function cardsDe(l){
  const area=(ruta(l.cat)||{}).area||"";
  (l.preguntas||[]).forEach((q,i)=>{const id=q.id||(l.id+"-q"+(i+1));if(S.cards.some(c=>c.id===id))return;
    S.cards.push({id,leccion:l.id,paper:(l.fuentes||[])[0],area,nivel:2,tipo:"control",q:q.q,a:{es:q.op.es[q.ok]+". "+q.exp.es,en:(q.op.en||q.op.es)[q.ok]+". "+(q.exp.en||q.exp.es)},fuente:l.titulo})});
  // tarjetas de aprendizaje del brief: entran al repaso del día en que se lee
  (l.tarjetas||[]).forEach((t,i)=>{const id=t.id||(l.id+"-t"+(i+1));if(S.cards.some(c=>c.id===id))return;
    S.cards.push({id,leccion:l.id,tarjeta:true,paper:(l.fuentes||[])[0],area,nivel:1,tipo:t.tipo||"concepto",q:t.q,a:t.a,fuente:l.titulo})});
}
async function getLec(id){
  if(S.lecFull[id])return S.lecFull[id];
  if(S.mis.lecciones[id])return S.lecFull[id]=S.mis.lecciones[id];
  const l=await getJSON("data/lecciones/"+encodeURIComponent(id)+".json");
  (l.preguntas||[]).forEach((q,i)=>{if(!q.id)q.id=l.id+"-q"+(i+1)});
  (l.tarjetas||[]).forEach((t,i)=>{if(!t.id)t.id=l.id+"-t"+(i+1)});
  S.lecFull[id]=l;cardsDe(l);return l;
}
function registrarMia(l){
  const meta={id:l.id,cat:l.cat,orden:l.orden||0,titulo:l.titulo,bajada:l.bajada,cita:l.cita,palabras:l.palabras,fuentes:[],nPreg:l.preguntas.length,nTarj:(l.tarjetas||[]).length,mia:true};
  S.lecById[l.id]=meta;if(!S.lecciones.some(x=>x.id===l.id))S.lecciones.push(meta);
  S.lecFull[l.id]=l;cardsDe(l);
}
function cargarMis(){
  const m=lsGet("breve-mis");if(m&&m.rutas)S.mis={rutas:m.rutas||[],lecciones:m.lecciones||{}};

    S.areas=a;S.indice=ix.papers||[];S.niveles=ix.niveles||{};S.rutas=ru.rutas||[];
    S.indice.forEach(p=>S.byId[p.id]=p);
    S.papers=fi;

    const rord={};S.rutas.forEach((r,i)=>rord[r.id]=i);
    S.lecciones=li.slice().sort((a,b)=>((rord[a.cat]??999)-(rord[b.cat]??999))||(a.orden-b.orden));

    S.nuevo=!lsGet("breve-estado");

    S.est.cfg=Object.assign(defaultEst().cfg,S.est.cfg||{});

    (S.areas?S.areas.orden:[]).forEach(code=>{if(!S.est.cfg.vistas.includes(code)){S.est.cfg.vistas.push(code);if(!S.est.cfg.areas.includes(code))S.est.cfg.areas.push(code)}});

  S.ready=true;route();

}

/* ---------- cuenta y nube (Firebase, opcional) ---------- */
function cargarScript(src){return new Promise((ok,mal)=>{const x=document.createElement("script");x.src=src;x.onload=ok;x.onerror=mal;document.head.appendChild(x)})}
async function nubeIniciar(){
  const N=S.nube;if(!FIREBASE_CONFIG||N.listo||N.cargando)return;N.cargando=true;
  try{
    const b="https://www.gstatic.com/firebasejs/"+FB_VER+"/";
    await cargarScript(b+"firebase-app-compat.js");
    await Promise.all([cargarScript(b+"firebase-auth-compat.js"),cargarScript(b+"firebase-firestore-compat.js")]);

function nubeEntrar(){const p=new firebase.auth.GoogleAuthProvider();firebase.auth().signInWithPopup(p).catch(e=>{if(/popup-blocked|operation-not-supported/.test(e.code||""))firebase.auth().signInWithRedirect(p);else{S.nube.error=e.message;route()}})}
function nubeSalir(){firebase.auth().signOut().then(()=>route())}
/* Eliminar la cuenta (Ley 25.326): borra brief/{uid} y su subcolección lecciones, después el usuario de Firebase.
   Si Firebase pide un inicio de sesión reciente, se vuelve a autenticar y se reintenta. */
async function nubeBorrarDatos(){
  const ls=await docU().collection("lecciones").get();const refs=ls.docs.map(d=>d.ref);
  for(let i=0;i<refs.length;i+=400){const b=S.nube.db.batch();refs.slice(i,i+400).forEach(r=>b.delete(r));await b.commit()}
  await docU().delete();
}
async function nubeReautenticar(u){
  const es=S.lang==="es";const prov=(u.providerData||[]).map(p=>p.providerId);
  if(prov.includes("google.com")){await u.reauthenticateWithPopup(new firebase.auth.GoogleAuthProvider());return}
  const clave=prompt(es?"Por seguridad, escribí tu contraseña para confirmar que querés eliminar la cuenta:":"For security, type your password to confirm deleting the account:");
  if(!clave)throw new Error(es?"Eliminación cancelada: la cuenta sigue activa.":"Deletion cancelled: the account is still active.");
  await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,clave));
}
async function borrarDatosLocales(){
  try{localStorage.clear()}catch(e){}try{sessionStorage.clear()}catch(e){}
  ["breve-docs","prebisch-bib"].forEach(n=>{try{indexedDB.deleteDatabase(n)}catch(e){}});
  try{if(window.caches)await caches.delete("prebisch-aviso")}catch(e){}
}
async function nubeEliminarCuenta(){
  const es=S.lang==="es";const N=S.nube;let u=firebase.auth().currentUser;if(!u)throw new Error(es?"No hay una sesión iniciada.":"Not signed in.");
  if(!confirm(es?"¿Eliminar tu cuenta de Prebisch?\n\nSe borran de la nube tu progreso, tus rutas y los briefs que guardaste, y se elimina tu usuario. No se puede deshacer.":"Delete your Prebisch account?\n\nYour cloud progress, routes and saved briefs will be erased and your user deleted. This cannot be undone."))return "";
  N.borrando=true;
  try{
    if(avisosActivos())await avisosDesactivar().catch(()=>{});
    const intentar=async()=>{await nubeBorrarDatos();await firebase.auth().currentUser.delete()};
    try{await intentar()}
    catch(e){if(!e||e.code!=="auth/requires-recent-login")throw e;
      await nubeReautenticar(firebase.auth().currentUser);await intentar()}

function interleave(list){const g={};list.forEach(c=>{(g[c.area]=g[c.area]||[]).push(c)});const keys=Object.keys(g);const out=[];let i=0;while(out.length<list.length){const k=keys[i%keys.length];if(g[k].length)out.push(g[k].shift());i++}return out}
/* Qué tarjetas pueden aparecer: las que ya están en repaso; las de los mazos del rack, desde el
   primer día; las de cada brief, desde que se lee. Las preguntas de control entran al terminar el quiz. */
function elegible(c){if(S.est.cards[c.id])return true;if(c.tarjeta)return !!S.est.lecciones[c.leccion];return !c.leccion}
function plan(onlyPaper){
  const t=today(),cfg=S.est.cfg,st=S.est.cards;
  const fr=cfg.foco?ruta(cfg.foco):null;const pos={};if(fr&&fr.tipo!=="mia")fr.pasos.forEach((id,i)=>pos[id]=i);
  const pool=S.cards.filter(c=>elegible(c)&&(onlyPaper?c.paper===onlyPaper:(cfg.areas.includes(c.area)||(c.paper in pos)||c.leccion)));
  const due=pool.filter(c=>st[c.id]&&st[c.id].d<=t).sort((a,b)=>st[a.id].d-st[b.id].d);
  const usadas=S.est.dia.f===t?S.est.dia.n:0;
  const cupoNuevas=onlyPaper?99:Math.max(0,cfg.nuevas-usadas);
  const rk=c=>(c.paper in pos)?pos[c.paper]:1e6;
  const deBrief=pool.filter(c=>!st[c.id]&&c.tarjeta).sort((a,b)=>((S.est.lecciones[b.leccion]||{}).d||0)-((S.est.lecciones[a.leccion]||{}).d||0)||a.id.localeCompare(b.id));
  const nuevas=deBrief.concat(pool.filter(c=>!st[c.id]&&!c.tarjeta).sort((a,b)=>(rk(a)-rk(b))||(a.nivel-b.nivel)||((a.paper||0)-(b.paper||0))).slice(0,cupoNuevas));
  const cap=onlyPaper?999:Math.max(4,cfg.minutos*2);
  const d=due.slice(0,cap);const n=nuevas.slice(0,Math.max(0,cap-d.length));
  return{due:d,nuevas:n,items:interleave(d.concat(n))};
}

function slotUTC(hora){const [H,M]=(hora||"08:00").split(":").map(Number);const d=new Date();d.setHours(H,M,0,0);
  const m=Math.round((d.getUTCHours()*60+d.getUTCMinutes())/30)*30%1440;const p=n=>String(n).padStart(2,"0");return p(Math.floor(m/60))+":"+p(m%60)}

async function suscripcion(){const reg=await navigator.serviceWorker.getRegistration();return reg?reg.pushManager.getSubscription():null}
async function workerPost(ruta,cuerpo){
  const tok=await tokenNube();
  const r=await fetch(WORKER_URL+ruta,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok},body:JSON.stringify(cuerpo)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("El servidor respondió "+r.status));return j;
}
async function avisosActivar(){
  const es=S.lang==="es";
  if(!S.nube.user)throw new Error(es?"Primero iniciá sesión en la sección Cuenta.":"Sign in first, in the Account section.");
  if(await Notification.requestPermission()!=="granted")throw new Error(es?"El navegador no dio permiso para avisar. Habilitalo en la configuración del sitio y probá de nuevo.":"The browser did not allow notifications. Enable them in site settings and try again.");
  const reg=await swReg();if(!reg)throw new Error(es?"No se pudo instalar el servicio de avisos.":"Could not install the notification service.");
  await navigator.serviceWorker.ready;
  const r=await fetch(WORKER_URL+"/push/clave");const k=await r.json().catch(()=>({}));
  if(!r.ok||!k.clave)throw new Error(k.error||(es?"El servidor de avisos todavía no está activo.":"The notification server is not active yet."));
  const clave=b64uBytes(k.clave);let sub=await reg.pushManager.getSubscription();
  if(sub&&sub.options&&sub.options.applicationServerKey){const v=new Uint8Array(sub.options.applicationServerKey);if(v.length!==clave.length||v.some((x,i)=>x!==clave[i])){await sub.unsubscribe();sub=null}}
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:clave});
  await workerPost("/push/alta",{sub:sub.toJSON(),slot:slotUTC(S.est.cfg.hora)});

/* --- documentos en IndexedDB (el texto queda solo en este dispositivo) --- */
function idb(){return new Promise((ok,mal)=>{const r=indexedDB.open("breve-docs",1);r.onupgradeneeded=()=>r.result.createObjectStore("docs",{keyPath:"id"});r.onsuccess=()=>ok(r.result);r.onerror=()=>mal(r.error)})}
async function docGuardar(d){const db=await idb();return new Promise((ok,mal)=>{const t=db.transaction("docs","readwrite");t.objectStore("docs").put(d);t.oncomplete=ok;t.onerror=()=>mal(t.error)})}
async function docLeer(id){const db=await idb();return new Promise(ok=>{const q=db.transaction("docs").objectStore("docs").get(id);q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null)})}

async function pdfjs(){if(window.pdfjsLib)return window.pdfjsLib;await cargarScript(PDFJS+"pdf.min.js");pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js";return pdfjsLib}
async function leerArchivo(f,avance){
  const id="d"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const titulo=f.name.replace(/\.(pdf|txt|md)$/i,"").replace(/[_]+/g," ");
  if(!/\.pdf$/i.test(f.name)){const t=await f.text();return{id,titulo,paginas:[t],n:1,chars:t.length}}
  const lib=await pdfjs();const pdf=await lib.getDocument({data:await f.arrayBuffer(),isEvalSupported:false}).promise;const paginas=[];
  for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();
    paginas.push(c.items.map(x=>x.str+(x.hasEOL?"\n":" ")).join("").replace(/[ \t]+/g," ").trim());if(avance)avance(i,pdf.numPages)}

   · "claude": la app arma el prompt, lo descargás, se lo das a Claude (claude.ai) junto con tus PDF y
     cargás acá la respuesta. No hace falta key.
   · "gemini" / "anthropic": tu propia key. La guarda y la usa SOLO ia/boveda.js, un Web Worker aparte:
     esta página nunca la lee, no la sube a Firebase ni la incluye en la copia. Ver docs/seguridad-keys.md. */
function iaCfg(){
  const c=Object.assign({modo:"claude",gmodelo:"gemini-3.8-flash",amodelo:"claude-sonnet-5-5"},lsGet("breve-ia")||{});
  if(c.modo==="servidor")c.modo="claude";

/* Bóveda: la key vive en el worker. La página solo recibe «hay key» y sus últimos 4 caracteres. */
const BOV={w:null,n:0,pend:{},est:null};
function bov(op,datos){
  if(!BOV.w){BOV.w=new Worker("ia/boveda.js?v=1");BOV.w.onmessage=e=>{const m=e.data||{};const f=BOV.pend[m.id];if(!f)return;delete BOV.pend[m.id];m.error?f[1](new Error(m.error)):f[0](m.ok)}}
  return new Promise((ok,mal)=>{const id=++BOV.n;BOV.pend[id]=[ok,mal];BOV.w.postMessage(Object.assign({},datos||{},{id,op}))})}

async function bovMigrar(){
  const raw=lsGet("breve-ia")||{};let ses={};try{ses=JSON.parse(sessionStorage.getItem("breve-ia-k")||"{}")||{}}catch(e){}
  const rec=raw.recordar!==false&&!!(raw.gkey||raw.akey);
  for(const [campoK,prov] of [["gkey","gemini"],["akey","anthropic"]]){const k=raw[campoK]||ses[campoK];if(k)await bov("guardar",{prov,key:k,recordar:raw[campoK]?rec:false}).catch(()=>{})}

const BIB={dir:null,archivos:[],mapa:lsGet("prebisch-bib")||{},permiso:false,estado:""};
const bibSoportada=()=>"showDirectoryPicker" in window;
const normal=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
const VACIAS=new Set("de la el los las del en y a the of and in on for to an un una por con sobre para que su sus al se es como entre from with at by".split(" "));
const ROM={i:1,ii:2,iii:3,iv:4,v:5,vi:6,vii:7,viii:8,ix:9,x:10};
function fichas(t){return normal(t).split(" ").map(w=>ROM[w]?String(ROM[w]):w).filter(w=>/^\d+$/.test(w)||(w.length>2&&!VACIAS.has(w)))}
async function bibIDB(){return new Promise((ok,mal)=>{const r=indexedDB.open("prebisch-bib",1);r.onupgradeneeded=()=>r.result.createObjectStore("h");r.onsuccess=()=>ok(r.result);r.onerror=()=>mal(r.error)})}

// puntaje: palabras del título encontradas en el nombre del archivo, más autor y año
function bibPuntaje(p,f){
  const tt=fichas(p.titulo);if(!tt.length)return 0;const fs=new Set(f.t);
  const pal=tt.filter(w=>!/^\d+$/.test(w)),num=tt.filter(w=>/^\d+$/.test(w));
  let s=pal.length?pal.filter(w=>fs.has(w)).length/Math.min(pal.length,8):.5;
  // los números del título (unidad, clase, capítulo) tienen que estar en el nombre del archivo
  if(num.length&&!num.every(w=>fs.has(w)))s*=.3;
  if(p.curso&&fichas(p.curso).some(w=>w.length>3&&fs.has(w)))s+=.2;
  const au=fichas((p.cita||"").replace(/\(.*?\)/g," ")).filter(w=>!/^\d+$/.test(w)&&w!=="eds"&&w!=="et"&&w!=="al");
  const okAu=au.some(w=>fs.has(w));if(okAu)s+=.35;
  const y=(p.cita||"").match(/\d{4}/);const okY=y&&f.t.includes(y[0]);if(okY)s+=.15;
  // autor y año juntos alcanzan («Triana (2019).pdf»), salvo que el título pida un número (capítulo, unidad) que falta
  if(okAu&&okY&&!(num.length&&!num.every(w=>fs.has(w))))s=Math.max(s,.65);
  // con autor conocido que no figura en el nombre ni el año, el título tiene que coincidir casi entero
  else if(au.length&&!okAu&&!okY)s*=.75;
  // títulos muy cortos («Unidad 2») no alcanzan solos
  if(pal.length<2&&!okAu&&!(p.curso&&fichas(p.curso).some(w=>w.length>3&&fs.has(w))))s*=.5;
  return s;
}
function bibEmparejar(){
  const libres=new Set(BIB.archivos.map(f=>f.ruta));Object.values(BIB.mapa).forEach(r=>libres.delete(r));
  const cand=[];S.indice.forEach(p=>{if(BIB.mapa[p.id])return;BIB.archivos.forEach(f=>{if(!libres.has(f.ruta))return;const s=bibPuntaje(p,f);if(s>=.6)cand.push([s,p.id,f.ruta])})});
  cand.sort((a,b)=>b[0]-a[0]);let n=0;
  for(const [,id,r] of cand){if(BIB.mapa[id]||!libres.has(r))continue;BIB.mapa[id]=r;libres.delete(r);n++}
  lsSet("prebisch-bib",BIB.mapa);return n;
}
