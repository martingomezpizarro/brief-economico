<meta name="theme-color" content="#FAF5EC">

<style>
/* Layout: una columna de lectura (≈38rem) estilo paper anotado; en pantallas anchas la ficha abre una columna de notas al margen. */
:root{
  --bg:#FAF5EC; --surface:#FFFDF8; --honey:#F3E4CC; --line:#E8DCC9; --line2:#D6C6B0;
  --ink:#3A2A22; --ink2:#4E3A30; --muted:#6A4940; --accent:#8A4F2A; --accent-ink:#FFFFFF; --again:#A33A22;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1C1612; --surface:#241D18; --honey:#3A2C20; --line:#352A22; --line2:#4A3B30;
  --ink:#EFE6DA; --ink2:#DCCDBE; --muted:#C2AE9D; --accent:#D9A06A; --accent-ink:#1C1612; --again:#F08A6C; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1C1612; --surface:#241D18; --honey:#3A2C20; --line:#352A22; --line2:#4A3B30;
  --ink:#EFE6DA; --ink2:#DCCDBE; --muted:#C2AE9D; --accent:#D9A06A; --accent-ink:#1C1612; --again:#F08A6C; color-scheme:dark }

html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
a{color:var(--accent);text-underline-offset:2px;text-decoration-thickness:1px}
a:hover{color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:40rem;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.c{text-align:center}
.j{text-align:justify;hyphens:auto;-webkit-hyphens:auto}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;text-align:left}

/* barra */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px 12px;border-bottom:1px solid var(--line)}
.brand{font-weight:600;font-size:19px;text-decoration:none;color:var(--ink)}
.nav{display:flex;gap:4px;flex-wrap:wrap;font-family:var(--mono);font-size:12px}
.nav a{padding:8px 10px;text-decoration:none;color:var(--muted);border-radius:2px}
.nav a[aria-current="page"]{color:var(--ink);background:var(--honey)}
.lang{display:flex;gap:4px;font-family:var(--mono);font-size:12px}
.lang button{min-width:44px;min-height:32px;border:1px solid var(--line2);background:transparent;color:var(--muted);border-radius:2px}
.lang button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* bloques */
.block{display:flex;flex-direction:column;gap:12px}
.rule{border-top:1px solid var(--line);padding-top:20px}
.box{background:var(--honey);padding:14px 16px;border-radius:2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.stat b{display:block;font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.btn{min-height:48px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:2px;font-size:16px;padding:0 20px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.cajas{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;text-align:center;font-family:var(--mono);font-size:12px}
.caja{border:1px solid var(--line);padding:8px 2px;border-radius:2px;color:var(--muted)}
.caja b{display:block;font-size:16px;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}
.note{font-size:14px;color:var(--muted)}

/* sesión */
.card{display:flex;flex-direction:column;gap:16px;padding-top:4px}
.card h2{font-size:23px;line-height:1.3;text-align:center}
.cita{font-style:italic;color:var(--muted);text-align:center;font-size:15px}
.ans{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.ans p{font-size:17px}
.fuente{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-family:var(--mono);font-size:12px}
.grades button{min-height:48px;border:1px solid var(--line2);background:transparent;border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.grades button small{color:var(--muted);font-size:10px}
.grades .g1{color:var(--again)}
.top{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted);gap:8px}
.meter{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .25s}

/* ficha */
.ficha{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media (min-width:640px){ .ficha.margen{grid-template-columns:minmax(0,1fr) 10rem} .wrap.ancha{max-width:52rem} }
.ficha section{display:flex;flex-direction:column;gap:8px}
.ficha h3{font-size:13px;font-family:var(--mono);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);text-align:center}
.aside{font-size:13px;line-height:1.45;color:var(--muted);display:flex;flex-direction:column;gap:14px;text-align:left}
.aside b{font-family:var(--mono);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);display:block;margin-bottom:2px}
.eq{background:var(--honey);padding:12px 14px;border-radius:2px;overflow-x:auto;display:flex;flex-direction:column;gap:8px;align-items:center}
.eq .raw{font-family:var(--mono);font-size:13px;white-space:pre-wrap;word-break:break-word}
dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
dt{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
dd{margin:0}
.critica{color:var(--ink2)}

/* rack */
.area{display:flex;flex-direction:column;gap:10px;scroll-margin-top:16px}
.area h2{font-size:20px;text-align:center}
.area .cnt{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}
.plist{list-style:none;padding:0;gap:0}
.plist li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.plist li .t{min-width:0;overflow-wrap:anywhere}
.tag{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.tag.on{color:var(--accent)}
.leccion{display:flex;flex-direction:column;gap:14px}
.leccion h1{font-size:27px;line-height:1.22}
.leccion h2{font-size:19px;margin-top:10px}
.leccion section{display:flex;flex-direction:column;gap:10px}
.leccion .lead{font-size:18px}
.leccion .box h2{margin-top:0}
.ops{display:flex;flex-direction:column;gap:8px}
.op{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line2);background:var(--surface);border-radius:2px;padding:12px 14px;min-height:48px;font-size:16px;line-height:1.4}
.op .let{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:3px;flex:none}
.op:not(:disabled):hover{border-color:var(--accent)}
.op:disabled{cursor:default}
.op.ok{border-color:var(--accent);background:var(--honey)}
.op.mal{border-color:var(--again);color:var(--again)}
.bien{color:var(--accent);font-weight:600}
p.mal{color:var(--again);font-weight:600}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.campo{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.campo label,.campo .lbl{font-size:15px}
.campo textarea,.campo input[type=text],.campo input[type=password],.campo input[type=number],.campo select{font:15px var(--serif);background:var(--surface);color:var(--ink);border:1px solid var(--line2);border-radius:2px;padding:10px;width:100%;box-sizing:border-box}
.campo textarea{min-height:96px;resize:vertical}
.docs{list-style:none;padding:0;display:flex;flex-direction:column;gap:0}
.docs li{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:9px 0}
.docs li .t{flex:1;min-width:0;overflow-wrap:anywhere}
.docs .meta{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.campo select,#main select{max-width:100%}
main select{width:100%}
.row>*{min-width:0}
.row select{max-width:100%}
.eq{max-width:100%;box-sizing:border-box}
.leccion,.leccion section{min-width:0;max-width:100%}
.tex{max-width:100%;overflow-x:auto}
.eq .raw{overflow-wrap:anywhere}
#main,#main>*{min-width:0;max-width:100%}
select{min-width:0;max-width:100%}
.docs input[type=text]{width:6.5rem;font:13px var(--mono);padding:6px;border:1px solid var(--line2);border-radius:2px;background:var(--surface);color:var(--ink)}
.mini{font:12px var(--mono);border:1px solid var(--line2);background:transparent;border-radius:2px;padding:6px 8px;min-height:32px;color:var(--muted)}
.estado{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;white-space:pre-wrap}
.estado.error{color:var(--again)}
.drop{border:1px dashed var(--line2);border-radius:2px;padding:18px;text-align:center;color:var(--muted);cursor:pointer}
.drop.sobre{border-color:var(--accent);background:var(--honey)}
.pasoplan{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:flex-start}
.pasoplan .t{flex:1}
.pasoplan input[type=text]{width:100%;font:600 15px var(--serif);border:1px solid var(--line2);border-radius:2px;padding:6px;background:var(--surface);color:var(--ink);box-sizing:border-box}
.plist .num{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:1.8rem;flex:none}
.plist .t{flex:1}
.plist .meta,.rutas .meta{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.plist a.sinficha{color:var(--ink2);text-decoration-color:var(--line2)}
.tag.leido{color:var(--accent)}
.rutas{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:10px}
.rutas li{border:1px solid var(--line);border-radius:2px;padding:12px;display:flex;flex-direction:column;gap:8px}
.rutas li.foco{border-color:var(--accent);background:var(--honey)}
.rutas li>a{font-weight:600;text-decoration:none;color:var(--ink)}
.rutas li>a:hover{color:var(--accent)}
.leer{display:flex;gap:8px;align-items:center;justify-content:center;font-size:15px}
.leer input{accent-color:var(--accent);width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);padding:3px 8px;border-radius:2px;color:var(--muted)}

/* ajustes */
.form{display:flex;flex-direction:column;gap:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:12px;flex-wrap:wrap}
.row label{flex:1;min-width:10rem}
.row input[type=time],.row input[type=number],.row select{font:500 15px var(--mono);background:var(--surface);color:var(--ink);border:1px solid var(--line2);border-radius:2px;padding:8px;min-height:40px;width:8rem}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(14rem,100%),1fr));gap:8px;border-top:1px solid var(--line);padding-top:12px}
.checks label{display:flex;gap:8px;align-items:center;font-size:15px}
.checks input{accent-color:var(--accent);width:18px;height:18px}
.empty{border:1px dashed var(--line2);padding:20px;border-radius:2px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function interleave(list){const g={};list.forEach(c=>{(g[c.area]=g[c.area]||[]).push(c)});const keys=Object.keys(g);const out=[];let i=0;while(out.length<list.length){const k=keys[i%keys.length];if(g[k].length)out.push(g[k].shift());i++}return out}
function plan(onlyPaper){
  const t=today(),cfg=S.est.cfg,st=S.est.cards;
  const fr=cfg.foco?ruta(cfg.foco):null;const pos={};if(fr)fr.pasos.forEach((id,i)=>pos[id]=i);
  const pool=S.cards.filter(c=>(st[c.id]||(!c.leccion&&S.est.leidos[c.paper]))&&(onlyPaper?c.paper===onlyPaper:(cfg.areas.includes(c.area)||(c.paper in pos)||c.leccion)));
  const due=pool.filter(c=>st[c.id]&&st[c.id].d<=t).sort((a,b)=>st[a.id].d-st[b.id].d);
  const usadas=S.est.dia.f===t?S.est.dia.n:0;
  const cupoNuevas=onlyPaper?99:Math.max(0,cfg.nuevas-usadas);
  const rk=c=>(c.paper in pos)?pos[c.paper]:1e6;
  const nuevas=pool.filter(c=>!st[c.id]).sort((a,b)=>(rk(a)-rk(b))||(a.nivel-b.nivel)||(a.paper-b.paper)).slice(0,cupoNuevas);
  const cap=onlyPaper?999:Math.max(4,cfg.minutos*2);
  const d=due.slice(0,cap);const n=nuevas.slice(0,Math.max(0,cap-d.length));
  return{due:d,nuevas:n,items:interleave(d.concat(n))};
}

function grade(g){
  const ses=S.ses;const c=ses.q[ses.i];const t=today();const st=S.est.cards;const prev=st[c.id];
  if(!prev){if(S.est.dia.f!==t)S.est.dia={f:t,n:0};S.est.dia.n++}
  let b=prev?prev.b:0,d;
  if(g===1){b=1;d=t}else if(g===2){b=Math.max(1,b);d=t+Math.ceil(INT[b-1]/2)}else if(g===3){b=Math.min(6,b+1);d=t+INT[b-1]}else{b=Math.min(6,b+2);d=t+INT[b-1]}
  st[c.id]={b,d};ses.g[g]++;
  S.est.hist[t]=(S.est.hist[t]||0)+1;
  if(g===1){ses.q.splice(Math.min(ses.q.length,ses.i+4),0,c)}else ses.done++;
  ses.i++;ses.shown=false;save();
  if(ses.i>=ses.q.length){save(true);viewFin()}else viewCard();

async function leerArchivo(f,avance){
  const id="d"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const titulo=f.name.replace(/\.(pdf|txt|md)$/i,"").replace(/[_]+/g," ");
  if(!/\.pdf$/i.test(f.name)){const t=await f.text();return{id,titulo,paginas:[t],n:1,chars:t.length}}
  const lib=await pdfjs();const pdf=await lib.getDocument({data:await f.arrayBuffer()}).promise;const paginas=[];
  for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();
    paginas.push(c.items.map(x=>x.str+(x.hasEOL?"\n":" ")).join("").replace(/[ \t]+/g," ").trim());if(avance)avance(i,pdf.numPages)}
  return{id,titulo,paginas,n:pdf.numPages,chars:paginas.reduce((a,b)=>a+b.length,0)};

function rango(str,n){const m=String(str||"").match(/(\d+)\s*[-–a]\s*(\d+)/);if(!m)return[1,n];const a=Math.max(1,+m[1]),b=Math.min(n,+m[2]);return a<=b?[a,b]:[1,n]}

    S.mis.lecciones[l.id]=l;registrarMia(l);p.lec=l.id;r.t=Date.now();guardarMis();
    E.ocupado=false;setEstado("");location.hash="#l-"+encodeURIComponent(l.id);return;
  }catch(e){setEstado(e.message,true)}
  E.ocupado=false;
}
async function resubir(r,fs){
  const es=S.lang==="es";
  for(const f of fs){const d=await leerArchivo(f).catch(()=>null);if(!d)continue;
    const k=r.docs.findIndex(x=>!x.rack&&x.titulo===d.titulo)>=0?r.docs.findIndex(x=>!x.rack&&x.titulo===d.titulo):r.docs.findIndex(x=>!x.rack&&x.n===d.n);
    if(k<0){setEstado((es?"No coincide con ningún documento de la ruta: ":"Matches no document in this path: ")+f.name,true);continue}
    d.id=r.docs[k].id;await docGuardar(d);
  }
  viewMiRuta(r);
}
function viewMiRuta(r){
  const es=S.lang==="es";const enFoco=S.est.cfg.foco===r.id;
  const reup=h("input",{type:"file",accept:".pdf,.txt,.md",multiple:true,style:"display:none",on:{change:e=>resubir(r,[...e.target.files])}});
  mount(h("p",{class:"eyebrow c"},h("a",{href:"#rutas"},es?"Mi estudio":"My study")),
    h("h1",{class:"c",style:"font-size:26px;line-height:1.25"},r.nombre),
    r.desc?h("p",{class:"j"},r.desc):null,
    h("button",{class:"btn"+(enFoco?" ghost":""),type:"button",on:{click:()=>{S.est.cfg.foco=enFoco?"":r.id;save(true);viewMiRuta(r)}}},enFoco?(es?"Quitar el foco":"Remove focus"):(es?"Poner en foco":"Focus this path")),
    h("section",{class:"block rule"},
      h("ul",{class:"plist pasos"},r.pasos.map((p,i)=>{const l=p.lec&&S.lecById[p.lec];const d=l&&S.est.lecciones[l.id];
        return h("li",null,h("span",{class:"num"},String(i+1)),
          h("span",{class:"t"},l?h("a",{href:"#l-"+encodeURIComponent(l.id)},l.titulo):h("span",null,p.titulo),h("span",{class:"meta"},p.foco)),
          l?h("span",{class:"tag"+(d?" leido":" on")},d?d.ok+"/"+d.n:(es?"para leer":"to read")):
            h("button",{class:"mini",type:"button",disabled:E.ocupado,on:{click:()=>generarPaso(r,i)}},es?"Generar":"Generate"))})),
      h("p",{id:"estado",class:"estado"+(E.error?" error":"")},E.estado)),
    h("section",{class:"block rule"},
      h("p",{class:"eyebrow c"},es?"Documentos de la ruta":"Documents in this path"),
      h("ul",null,r.docs.map(d=>h("li",null,d.titulo+(d.rack?(es?" (brief del rack)":" (rack brief)"):"")))),
      h("p",{class:"note j"},es?"El texto de tus PDF queda solo en este dispositivo. Si cambiás de compu o de celular, volvé a subirlos acá para generar los pasos que faltan; los briefs ya generados se sincronizan si iniciaste sesión.":"Your PDFs' text stays on this device. On another device, re-upload them here to generate the remaining steps; generated briefs sync if you are signed in."),
      h("button",{class:"btn ghost",type:"button",on:{click:()=>reup.click()}},es?"Volver a subir los PDF":"Re-upload the PDFs"),reup,
      h("p",{class:"c small"},h("a",{href:"#",on:{click:e=>{e.preventDefault();if(confirmarBorrar(r))location.hash="#rutas"}}},es?"Borrar esta ruta":"Delete this path"))));
}
function confirmarBorrar(r){
  const i=S.mis.rutas.indexOf(r);if(i<0)return false;
  S.mis.rutas.splice(i,1);r.pasos.forEach(p=>{if(p.lec){delete S.mis.lecciones[p.lec];const k=S.lecciones.findIndex(x=>x.id===p.lec);if(k>=0)S.lecciones.splice(k,1);delete S.lecById[p.lec];
    if(S.nube.user&&S.nube.db)docU().collection("lecciones").doc(p.lec).delete().catch(()=>{})}});
  if(S.est.cfg.foco===r.id)S.est.cfg.foco="";guardarMis();save(true);return true;
}

/* --- Ajustes: cuenta, IA y copia --- */
function seccionCuenta(){
  const es=S.lang==="es";const N=S.nube;
  if(!FIREBASE_CONFIG)return null;
  return h("section",{class:"block rule"},h("p",{class:"eyebrow c"},es?"Cuenta":"Account"),
    N.user?h("p",{class:"c"},(es?"Sesión iniciada como ":"Signed in as ")+(N.user.email||N.user.displayName||"")+". "+(es?"Tu progreso y tus briefs se guardan en la nube.":"Your progress and briefs are saved to the cloud.")):
      h("p",{class:"j"},es?"Iniciá sesión con Google para guardar tu progreso y tus briefs en la nube, usarlos en cualquier dispositivo y generar briefs con el servidor de la app (gratis, con un cupo diario).":"Sign in with Google to sync progress and briefs and to generate briefs with the app's server (free, daily quota)."),
    N.error?h("p",{class:"estado error"},N.error):null,
    N.listo?(N.user?h("button",{class:"btn ghost",type:"button",on:{click:nubeSalir}},es?"Cerrar sesión":"Sign out"):h("button",{class:"btn",type:"button",on:{click:nubeEntrar}},es?"Entrar con Google":"Sign in with Google")):(N.error?null:h("p",{class:"c note"},es?"Cargando…":"Loading…")));
}
function seccionIA(){
  const es=S.lang==="es";const c=iaCfg();
  const g=k=>e=>{c[k]=e.target.value.trim();iaGuardar(c)};
  const modo=h("select",{on:{change:e=>{c.modo=e.target.value;iaGuardar(c);viewAjustes()}}},
    [["servidor",es?"Servidor de la app (gratis, con cupo diario; requiere iniciar sesión)":"App server (free, daily quota; sign-in required)"],["gemini",es?"Mi propia key de Gemini (Google AI Studio)":"My own Gemini key"],["anthropic",es?"Mi propia key de Anthropic (Claude)":"My own Anthropic key"]].map(([v,t])=>{const o=h("option",{value:v},t);if(c.modo===v)o.selected=true;return o}));
  return h("section",{class:"block rule"},h("p",{class:"eyebrow c"},es?"Inteligencia artificial":"AI engine"),
    h("p",{class:"j"},es?"Con qué modelo se escriben los briefs de Mi estudio. Con una key propia el uso corre por tu cuenta y no tiene cupo; la key se guarda solo en este navegador y viaja directo al proveedor.":"Which model writes My study briefs. With your own key usage is on you and has no quota; the key stays in this browser and goes straight to the provider."),
    campo(es?"Motor":"Engine",modo),
    c.modo==="gemini"?[campo("Key de Gemini",h("input",{type:"password",value:c.gkey,placeholder:"AIza…",on:{change:g("gkey")}}),es?"Se saca gratis en aistudio.google.com/apikey. En el nivel gratuito Google puede usar los datos para mejorar sus modelos.":"Free at aistudio.google.com/apikey. On the free tier Google may use the data."),
      campo(es?"Modelo":"Model",h("input",{type:"text",value:c.gmodelo,on:{change:g("gmodelo")}}))]:null,
    c.modo==="anthropic"?[campo("Key de Anthropic",h("input",{type:"password",value:c.akey,placeholder:"sk-ant-…",on:{change:g("akey")}}),es?"Se crea en console.anthropic.com. Es de pago por uso.":"Create it at console.anthropic.com. Pay as you go."),
      campo(es?"Modelo":"Model",h("input",{type:"text",value:c.amodelo,on:{change:g("amodelo")}}))]:null);
}
function exportar(){
  const blob=new Blob([JSON.stringify({version:1,estado:S.est,mis:S.mis},null,0)],{type:"application/json"});
  const a=h("a",{href:URL.createObjectURL(blob),download:"breve-economico-"+new Date().toISOString().slice(0,10)+".json"});document.body.append(a);a.click();a.remove();
}
async function importar(e){
  const f=e.target.files[0];if(!f)return;
  try{const j=JSON.parse(await f.text());if(!j.estado)throw new Error("archivo inválido");
    S.est=Object.assign(defaultEst(),j.estado);S.est.cfg=Object.assign(defaultEst().cfg,j.estado.cfg||{});
    if(j.mis){j.mis.rutas.forEach(x=>{if(!S.mis.rutas.some(y=>y.id===x.id))S.mis.rutas.push(x)});Object.values(j.mis.lecciones||{}).forEach(l=>{S.mis.lecciones[l.id]=l;registrarMia(l)})}
    guardarMis();save(true);S.lang=S.est.cfg.lang||"es";route();
  }catch(err){mount(h("div",{class:"empty"},h("p",null,(S.lang==="es"?"No se pudo cargar la copia: ":"Could not load the copy: ")+err.message),h("p",null,h("a",{href:"#ajustes"},tr("volver")))))}
}


setNav("hoy");
boot();
})();
